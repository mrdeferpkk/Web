name: Deploy Lab 9 Angular site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab-9/acoustic-watch/package-lock.json

      - name: Install dependencies
        working-directory: lab-9/acoustic-watch
        run: npm ci

      - name: Build Angular app
        working-directory: lab-9/acoustic-watch
        run: npm run build -- --base-href=/Web/lab-9/acoustic-watch/browser/

      - name: Prepare Pages structure
        run: |
          mkdir -p _site/lab-9/acoustic-watch/browser
          cp -R lab-9/acoustic-watch/dist/acoustic-watch/browser/. _site/lab-9/acoustic-watch/browser/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=lab-9/acoustic-watch/browser/">
          <title>Acoustic Watch</title>
          EOF

      - name: Deploy to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
